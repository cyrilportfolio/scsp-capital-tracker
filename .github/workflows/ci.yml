name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate the synthetic dataset
        run: python -m src.generate_data
      - name: Run the test suite
        run: python -m pytest
      - name: Run the pipeline end to end
        run: python -m src.main --silencieux

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t scsp-tracker .
      - name: Run the pipeline inside the container
        run: |
          mkdir -p output && chmod 777 output
          docker run --rm \
            -v "${{ github.workspace }}/data:/app/data" \
            -v "${{ github.workspace }}/output:/app/output" \
            scsp-tracker
      - name: Check that the reporting pack was written
        run: |
          test -s output/reporting_20251231.xlsx
          test -s output/reporting_20251231.txt
          grep -q "Carried interest accru" output/reporting_20251231.txt
